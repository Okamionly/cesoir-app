name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR / branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-types-test-build:
    name: Lint · Types · Test · Build
    runs-on: ubuntu-latest
    # Allow committers to skip CI explicitly — e.g. [skip ci] on docs-only nudges.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit + integration tests (Vitest)
        run: npm run test:run
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NODE_ENV: test

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          # Ensure Sentry SDK is no-op at build time when DSN is absent.
          NEXT_TELEMETRY_DISABLED: "1"

  db-types-drift:
    name: Supabase types drift guard
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Only run when we have credentials in the repo. On forks / external PRs
    # Supabase CLI cannot reach the project, so we skip without failing.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Skip if Supabase credentials are missing
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        run: npm ci --prefer-offline --no-audit

      - name: Install Supabase CLI
        if: steps.gate.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Regenerate Supabase types
        if: steps.gate.outputs.skip == 'false'
        run: |
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" \
            > src/lib/supabase-types.generated.ts

      - name: Fail on drift
        if: steps.gate.outputs.skip == 'false'
        run: |
          if ! git diff --exit-code src/lib/supabase-types.generated.ts; then
            echo "::error::Supabase generated types drifted. Run 'npm run db:types' locally and commit the result."
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # E2E needs a real Supabase. On external PRs (no secrets) we skip.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Skip if credentials are missing
        id: gate
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$E2E_TEST_EMAIL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium webkit

      - name: Build (Next.js)
        if: steps.gate.outputs.skip == 'false'
        run: npm run build

      - name: Run E2E tests
        if: steps.gate.outputs.skip == 'false'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure() && steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
