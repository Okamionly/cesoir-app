name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly scan to catch leaks introduced via merge drift or history rewrites.
    - cron: "37 3 * * *"

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action posts findings to PRs when GITHUB_TOKEN is allowed.
      pull-requests: read

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks.toml lives at the repo root; if missing, gitleaks uses
          # its built-in rules (Stripe/Supabase/AWS/GitHub tokens, etc.).
          GITLEAKS_CONFIG: .gitleaks.toml
