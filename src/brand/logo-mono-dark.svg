<?xml version="1.0" encoding="UTF-8"?>
<!--
  CeSoir — Logo mono white on dark (landing header)
  240 × 60 — crescent + wordmark both #FFFFFF.
  Use on #0A0A0D backdrops.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60" role="img" aria-label="CeSoir">
  <title>CeSoir — mono dark</title>
  <desc>Version monochrome blanc sur fond sombre</desc>
  <defs>
    <mask id="crescent-mono-dark-mask">
      <rect width="60" height="60" fill="black"/>
      <circle cx="30" cy="30" r="22" fill="white"/>
      <circle cx="38" cy="26" r="20" fill="black"/>
    </mask>
  </defs>
  <rect width="60" height="60" fill="#FFFFFF" mask="url(#crescent-mono-dark-mask)"/>
  <text
    x="72"
    y="42"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="700"
    font-size="34"
    letter-spacing="-0.68"
    fill="#FFFFFF"
  >CeSoir</text>
</svg>
